backend:
  name: git-gateway
  branch: main

media_folder: "assets"
public_folder: "/assets"

collections:
  - name: "work"
    label: "Videos / Work"
    files:
      - label: "Danh sách video"
        name: "work"
        file: "content/work.json"
        format: json
        fields:
          - label: "Videos"
            name: "items"
            widget: "list"
            fields:
              - {label: "YouTube ID", name: "youtube_id", widget: "string", hint: "Chỉ lấy ID — ví dụ: wi4yGa61MyI"}
              - {label: "Tiêu đề dòng 1", name: "title1", widget: "string"}
              - {label: "Tiêu đề dòng 2", name: "title2", widget: "string", required: false}
              - {label: "Vai trò", name: "role", widget: "string"}
              - {label: "Hiển thị trang chính", name: "featured", widget: "boolean", default: false, hint: "Bật để hiện video này trên trang chủ (nên chọn tối đa 3)"}

  - name: "testimonials"
    label: "Testimonials"
    files:
      - label: "Danh sách testimonial"
        name: "testimonials"
        file: "content/testimonials.json"
        format: json
        fields:
          - label: "Quotes"
            name: "items"
            widget: "list"
            fields:
              - {label: "Nội dung", name: "quote", widget: "text"}
              - {label: "Tên", name: "author", widget: "string"}
              - {label: "Chức danh", name: "role", widget: "string"}

  - name: "about"
    label: "About"
    files:
      - label: "Thông tin cá nhân"
        name: "about"
        file: "content/about.json"
        format: json
        fields:
          - {label: "Đoạn giới thiệu 1", name: "bio1", widget: "text"}
          - {label: "Đoạn giới thiệu 2", name: "bio2", widget: "text"}
          - {label: "Camera", name: "camera", widget: "string"}
          - {label: "Phần mềm chỉnh sửa", name: "editorial", widget: "string"}
          - {label: "Chuyên môn", name: "specialty", widget: "string"}
          - label: "Tổ chức"
            name: "organizations"
            widget: "list"
            fields:
              - {label: "Tên tổ chức", name: "name", widget: "string"}
              - {label: "Thời gian", name: "period", widget: "string", hint: "Ví dụ: 2023–2025"}

  - name: "products"
    label: "Store / Sản phẩm"
    files:
      - label: "Danh sách sản phẩm"
        name: "products"
        file: "content/products.json"
        format: json
        fields:
          - label: "Sản phẩm"
            name: "items"
            widget: "list"
            fields:
              - {label: "Tên sản phẩm", name: "title", widget: "string"}
              - {label: "Tag định dạng", name: "tag", widget: "string", hint: "Ví dụ: .cube · 12 LUTs"}
              - {label: "Mô tả", name: "description", widget: "text"}
              - {label: "Giá (số)", name: "price", widget: "string", hint: "Chỉ điền số — ví dụ: 48"}
              - {label: "Đơn vị tiền", name: "currency", widget: "string", default: "USD"}
              - {label: "Nút mua", name: "cta", widget: "string", hint: "Buy now / Pre-order / Coming soon"}
              - {label: "Link mua", name: "link", widget: "string"}
              - label: "Trạng thái"
                name: "status"
                widget: "select"
                options:
                  - {label: "Đang bán", value: "available"}
                  - {label: "Pre-order", value: "preorder"}
                  - {label: "Sắp ra mắt", value: "coming_soon"}
              - {label: "Ảnh thumbnail", name: "image", widget: "image", required: false, hint: "Để trống nếu dùng nền mặc định"}
              - {label: "Hiển thị trang chính", name: "featured", widget: "boolean", default: false, hint: "Bật để hiện sản phẩm này trên trang chủ (nên chọn tối đa 3)"}

  - name: "settings"
    label: "Mạng xã hội & Liên hệ"
    files:
      - label: "Contact"
        name: "settings"
        file: "content/settings.json"
        format: json
        fields:
          - {label: "Email", name: "email", widget: "string"}
          - {label: "Instagram URL", name: "instagram", widget: "string"}
          - {label: "Facebook URL", name: "facebook", widget: "string"}
          - {label: "TikTok URL", name: "tiktok", widget: "string"}
          - {label: "YouTube Channel URL", name: "youtube_channel", widget: "string"}
