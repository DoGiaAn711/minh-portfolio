<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Store — CookedByAnDo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=JetBrains+Mono:wght@300;400;500;700&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<style>
  :root{
    --bg:#0a0a0a; --bg-raised:#141413; --bg-card:#17171a;
    --ink:#f4f1ea; --ink-dim:#b6b3ac; --ink-mute:#6e6c66;
    --line:rgba(244,241,234,0.10); --line-strong:rgba(244,241,234,0.22);
    --accent:#d4ff3a; --rec:#ff3b2f;
    --display:'Anton','Bebas Neue',sans-serif;
    --serif:'Fraunces','Times New Roman',serif;
    --sans:'Manrope',system-ui,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --maxw:1440px; --pad:clamp(20px,4vw,56px);
  }
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  body{ background:var(--bg); color:var(--ink); font-family:var(--sans); font-weight:400; line-height:1.5; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  img{ max-width:100%; display:block; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; border:0; background:none; color:inherit; }
  ::selection{ background:var(--accent); color:#000; }

  body::before{
    content:''; pointer-events:none; position:fixed; inset:0; z-index:100; opacity:.06; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/></svg>");
  }
  body::after{
    content:''; position:fixed; inset:0; pointer-events:none; z-index:99;
    background-image:linear-gradient(transparent 0,transparent 2px,rgba(255,255,255,.012) 3px,transparent 4px);
    background-size:100% 4px;
  }

  .hud{ position:sticky; top:0; z-index:50; backdrop-filter:blur(12px); background:rgba(10,10,10,0.7); border-bottom:1px solid var(--line); font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-dim); }
  .hud-inner{ max-width:var(--maxw); margin:0 auto; padding:10px var(--pad); display:grid; grid-template-columns:1fr auto 1fr; gap:24px; align-items:center; }
  .hud-left{ display:flex; gap:18px; align-items:center; }
  .hud-right{ display:flex; gap:24px; align-items:center; justify-content:flex-end; }
  .rec-dot{ display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--rec); margin-right:6px; animation:blink 1.6s infinite; box-shadow:0 0 12px var(--rec); }
  @keyframes blink{ 50%{ opacity:.25; } }
  .hud nav{ display:flex; gap:22px; }
  .hud nav a:hover{ color:var(--accent); }
  .hud-logo{ height:22px; display:block; }

  .page-header{ padding:clamp(48px,8vh,80px) var(--pad) clamp(32px,5vh,56px); border-bottom:1px solid var(--line); }
  .page-header-inner{ max-width:var(--maxw); margin:0 auto; display:flex; align-items:end; justify-content:space-between; gap:24px; flex-wrap:wrap; }
  .back-link{ font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-mute); transition:color .2s; margin-bottom:16px; display:block; }
  .back-link:hover{ color:var(--accent); }
  .page-title{ font-family:var(--display); font-weight:400; font-size:clamp(40px,7vw,100px); line-height:.9; text-transform:uppercase; letter-spacing:-.01em; }
  .page-title em{ font-family:var(--serif); font-style:italic; font-weight:300; text-transform:lowercase; color:var(--accent); }
  .page-count{ font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-mute); text-align:right; }

  .shop-section{ padding:clamp(40px,6vh,72px) var(--pad); }
  .shop-section-inner{ max-width:var(--maxw); margin:0 auto; }

  .all-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:24px; }

  .product{ border:1px solid var(--line); background:var(--bg); display:flex; flex-direction:column; transition:border-color .3s; }
  .product:hover{ border-color:var(--accent); }
  .product-thumb{ aspect-ratio:4/3; position:relative; overflow:hidden; border-bottom:1px solid var(--line); }
  .product-thumb img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .product-thumb::after{ content:''; position:absolute; inset:0; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n5'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='1' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n5)' opacity='.18'/></svg>"); mix-blend-mode:overlay; pointer-events:none; }
  .product-tag{ position:absolute; top:16px; left:16px; font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; background:rgba(10,10,10,.85); color:var(--ink); padding:6px 10px; border:1px solid var(--line-strong); z-index:2; }
  .product-status{ position:absolute; top:16px; right:16px; font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); z-index:2; display:flex; align-items:center; gap:6px; }
  .product-status .dot{ width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent); }
  .product-body{ padding:24px 22px 22px; display:flex; flex-direction:column; flex:1; }
  .product-body h3{ font-family:var(--display); font-weight:400; font-size:clamp(22px,2vw,30px); line-height:1; text-transform:uppercase; letter-spacing:-.005em; margin-bottom:10px; }
  .product-body p{ font-family:var(--sans); font-size:14px; line-height:1.55; color:var(--ink-dim); margin-bottom:22px; flex:1; }
  .product-foot{ display:flex; justify-content:space-between; align-items:end; border-top:1px solid var(--line); padding-top:18px; }
  .product-price{ font-family:var(--display); font-size:32px; line-height:1; color:var(--ink); }
  .product-price small{ font-family:var(--mono); font-size:11px; letter-spacing:.1em; color:var(--ink-mute); margin-left:4px; }
  .product-cta{ display:inline-flex; align-items:center; gap:8px; font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; padding:12px 16px; border:1px solid var(--ink); color:var(--ink); transition:all .25s; }
  .product-cta:hover{ background:var(--accent); border-color:var(--accent); color:#000; }

  footer{ border-top:1px solid var(--line); padding:40px var(--pad) 32px; background:var(--bg); }
  .footer-inner{ max-width:var(--maxw); margin:0 auto; display:grid; grid-template-columns:1fr auto 1fr; gap:24px; align-items:center; font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-mute); }
  .footer-inner .center{ text-align:center; }
  .footer-inner .right{ text-align:right; }
  .footer-inner a:hover{ color:var(--accent); }

  .reveal{ opacity:0; transform:translateY(20px); transition:opacity .9s ease,transform .9s ease; }
  .reveal.in{ opacity:1; transform:none; }

  @media(max-width:900px){ .all-grid{ grid-template-columns:repeat(2,1fr); } .hud-inner{ grid-template-columns:1fr 1fr; } }
  @media(max-width:580px){ .all-grid{ grid-template-columns:1fr; } .footer-inner{ grid-template-columns:1fr; text-align:center; } .footer-inner .right{ text-align:center; } }
</style>
</head>
<body>

<header class="hud">
  <div class="hud-inner">
    <div class="hud-left">
      <span><span class="rec-dot"></span>REC</span>
    </div>
    <nav>
      <a href="/#work">Work</a>
      <a href="/#about">About</a>
      <a href="/#shop">Store</a>
      <a href="/#contact">Contact</a>
    </nav>
    <div class="hud-right">
      <span id="tc">00:00:00:00</span>
      <img src="/assets/logo_AnDo_Ver_White.png" alt="CookedByAnDo" class="hud-logo">
    </div>
  </div>
</header>

<div class="page-header">
  <div class="page-header-inner">
    <div>
      <a href="/" class="back-link">← Back to portfolio</a>
      <h1 class="page-title">The <em>store</em></h1>
    </div>
    <div class="page-count" id="productCount"></div>
  </div>
</div>

<div class="shop-section">
  <div class="shop-section-inner">
    <div class="all-grid" id="allShopGrid"></div>
  </div>
</div>

<footer>
  <div class="footer-inner">
    <div>© 2026 AnDo · All rights reserved</div>
    <div class="center">Made in Hà Nội</div>
    <div class="right"><a href="/">← Portfolio</a></div>
  </div>
</footer>

<script>
  (function(){
    const el = document.getElementById('tc');
    if(!el) return;
    function pad(n,l=2){ return String(n).padStart(l,'0'); }
    function tick(){ const d=new Date(); el.textContent=`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}:${pad(Math.floor(d.getMilliseconds()/40),2)}`; }
    setInterval(tick,40); tick();
  })();

  const io = new IntersectionObserver(entries=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  },{threshold:.1});

  const STATUS_LABEL = { available:'Available', preorder:'Pre-order', coming_soon:'Coming soon' };
  const gradients = [
    'linear-gradient(135deg,#1a1410 0%,#2a2410 50%,#d4ff3a 220%)',
    'linear-gradient(160deg,#0a0e1a 0%,#1c2940 60%,#ff3b2f 200%)',
    'linear-gradient(140deg,#1a1410 0%,#3a2a1a 60%,#ff8a2a 180%)',
    'linear-gradient(150deg,#0e1a14 0%,#1a3a2a 70%,#d4ff3a 200%)',
    'linear-gradient(130deg,#1a0a14 0%,#2e1a30 60%,#ff3b88 200%)',
  ];

  fetch('/content/products.json').then(r=>r.json()).then(data=>{
    const items = data.items;
    document.getElementById('productCount').textContent = `${items.length} products · Instant download`;
    document.getElementById('allShopGrid').innerHTML = items.map((item,i)=>{
      const statusLabel = STATUS_LABEL[item.status] || item.status;
      const thumb = item.image
        ? `<img src="${item.image}" alt="${item.title}">`
        : `<div style="position:absolute;inset:0;background:${gradients[i%gradients.length]};"></div>`;
      const ctaHref = item.link && item.link !== '#' ? item.link : '#';
      return `<article class="product reveal">
        <div class="product-thumb">
          <span class="product-tag">${item.tag}</span>
          <span class="product-status"><span class="dot"></span>${statusLabel}</span>
          ${thumb}
        </div>
        <div class="product-body">
          <h3>${item.title}</h3>
          <p>${item.description}</p>
          <div class="product-foot">
            <div class="product-price">$${item.price}<small>${item.currency}</small></div>
            <a href="${ctaHref}" class="product-cta" ${ctaHref!=='#'?'target="_blank" rel="noopener"':''}>${item.cta} <span>→</span></a>
          </div>
        </div>
      </article>`;
    }).join('');
    document.querySelectorAll('.product').forEach(el=>io.observe(el));
  });
</script>
</body>
</html>
