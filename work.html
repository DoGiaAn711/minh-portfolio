<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>All Films — CookedByAnDo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=JetBrains+Mono:wght@300;400;500;700&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<style>
  :root{
    --bg:#0a0a0a; --bg-raised:#141413; --bg-card:#17171a;
    --ink:#f4f1ea; --ink-dim:#b6b3ac; --ink-mute:#6e6c66;
    --line:rgba(244,241,234,0.10); --line-strong:rgba(244,241,234,0.22);
    --accent:#d4ff3a; --rec:#ff3b2f;
    --display:'Anton','Bebas Neue',sans-serif;
    --serif:'Fraunces','Times New Roman',serif;
    --sans:'Manrope',system-ui,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --maxw:1440px; --pad:clamp(20px,4vw,56px);
  }
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  body{ background:var(--bg); color:var(--ink); font-family:var(--sans); font-weight:400; line-height:1.5; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  img{ max-width:100%; display:block; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; border:0; background:none; color:inherit; }
  ::selection{ background:var(--accent); color:#000; }

  body::before{
    content:''; pointer-events:none; position:fixed; inset:0; z-index:100; opacity:.06; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/></svg>");
  }
  body::after{
    content:''; position:fixed; inset:0; pointer-events:none; z-index:99;
    background-image:linear-gradient(transparent 0,transparent 2px,rgba(255,255,255,.012) 3px,transparent 4px);
    background-size:100% 4px;
  }

  .hud{ position:sticky; top:0; z-index:50; backdrop-filter:blur(12px); background:rgba(10,10,10,0.7); border-bottom:1px solid var(--line); font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-dim); }
  .hud-inner{ max-width:var(--maxw); margin:0 auto; padding:10px var(--pad); display:grid; grid-template-columns:1fr auto 1fr; gap:24px; align-items:center; }
  .hud-left{ display:flex; gap:18px; align-items:center; }
  .hud-right{ display:flex; gap:24px; align-items:center; justify-content:flex-end; }
  .rec-dot{ display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--rec); margin-right:6px; animation:blink 1.6s infinite; box-shadow:0 0 12px var(--rec); }
  @keyframes blink{ 50%{ opacity:.25; } }
  .hud nav{ display:flex; gap:22px; }
  .hud nav a{ position:relative; transition:color .2s; }
  .hud nav a:hover{ color:var(--accent); }
  .hud-logo{ height:22px; display:block; }

  .page-header{ padding:clamp(40px,7vh,72px) var(--pad) clamp(28px,4vh,48px); border-bottom:1px solid var(--line); }
  .page-header-inner{ max-width:var(--maxw); margin:0 auto; }
  .back-link{ font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-mute); transition:color .2s; display:inline-block; margin-bottom:20px; }
  .back-link:hover{ color:var(--accent); }
  .page-header-bottom{ display:flex; align-items:flex-end; justify-content:space-between; gap:24px; flex-wrap:wrap; }
  .page-title{ font-family:var(--display); font-weight:400; font-size:clamp(40px,7vw,100px); line-height:.9; text-transform:uppercase; letter-spacing:-.01em; }
  .page-title em{ font-family:var(--serif); font-style:italic; font-weight:300; text-transform:lowercase; color:var(--accent); }
  .page-count{ font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-mute); text-align:right; padding-bottom:6px; }

  .work-section{ padding:clamp(40px,6vh,72px) var(--pad); }
  .work-section-inner{ max-width:var(--maxw); margin:0 auto; }

  .all-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:24px; }
  .work-card{ position:relative; border:1px solid var(--line); overflow:hidden; transition:border-color .3s; }
  .work-card:hover{ border-color:var(--accent); }
  .work-thumb{ aspect-ratio:16/9; width:100%; position:relative; overflow:hidden; cursor:pointer; }
  .work-thumb img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
  .work-thumb::after{ content:''; position:absolute; inset:0; background:linear-gradient(to top,rgba(10,10,10,.7) 0%,transparent 50%); pointer-events:none; z-index:1; }
  .work-thumb::before{ content:''; position:absolute; inset:0; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='n3'><feTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='1' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n3)' opacity='.22'/></svg>"); mix-blend-mode:overlay; pointer-events:none; z-index:2; }
  .work-thumb-num{ position:absolute; top:18px; left:18px; font-family:var(--mono); font-size:11px; letter-spacing:.14em; color:var(--ink); opacity:.75; z-index:3; }
  .work-thumb-title{ position:absolute; bottom:22px; left:22px; right:22px; z-index:3; }
  .work-thumb-title h3{ font-family:var(--display); font-size:clamp(18px,2.2vw,32px); text-transform:uppercase; line-height:.9; color:var(--ink); font-weight:400; }
  .work-meta{ display:flex; justify-content:space-between; align-items:center; padding:14px 18px; font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-dim); border-top:1px solid var(--line); background:var(--bg-raised); }
  .work-meta .arrow{ color:var(--ink); transition:transform .3s,color .3s; }
  .work-card:hover .arrow{ color:var(--accent); transform:translateX(4px); }

  .video-modal{ display:none; position:fixed; inset:0; z-index:200; background:rgba(0,0,0,.92); align-items:center; justify-content:center; padding:24px; }
  .video-modal.open{ display:flex; }
  .video-modal-inner{ position:relative; width:100%; max-width:1100px; aspect-ratio:16/9; }
  .video-modal-inner iframe{ width:100%; height:100%; border:0; }
  .video-modal-close{ position:absolute; top:-44px; right:0; font-family:var(--mono); font-size:12px; letter-spacing:.14em; color:var(--ink-dim); cursor:pointer; text-transform:uppercase; transition:color .2s; }
  .video-modal-close:hover{ color:var(--accent); }

  footer{ border-top:1px solid var(--line); padding:40px var(--pad) 32px; background:var(--bg); }
  .footer-inner{ max-width:var(--maxw); margin:0 auto; display:grid; grid-template-columns:1fr auto 1fr; gap:24px; align-items:center; font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-mute); }
  .footer-inner .center{ text-align:center; }
  .footer-inner .right{ text-align:right; }
  .footer-inner a:hover{ color:var(--accent); }

  .reveal{ opacity:0; transform:translateY(20px); transition:opacity .9s ease,transform .9s ease; }
  .reveal.in{ opacity:1; transform:none; }

  @media(max-width:900px){ .all-grid{ grid-template-columns:repeat(2,1fr); } .hud-inner{ grid-template-columns:1fr 1fr; } }
  @media(max-width:580px){ .all-grid{ grid-template-columns:1fr; } .footer-inner{ grid-template-columns:1fr; text-align:center; } .footer-inner .right{ text-align:center; } }
</style>
</head>
<body>

<div class="video-modal" id="videoModal">
  <div class="video-modal-inner">
    <span class="video-modal-close" id="videoModalClose">✕ Close</span>
    <iframe id="videoModalFrame" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
  </div>
</div>

<header class="hud">
  <div class="hud-inner">
    <div class="hud-left">
      <span><span class="rec-dot"></span>REC</span>
    </div>
    <nav>
      <a href="/#work">Work</a>
      <a href="/#about">About</a>
      <a href="/#shop">Store</a>
      <a href="/#contact">Contact</a>
    </nav>
    <div class="hud-right">
      <span id="tc">00:00:00:00</span>
      <img src="/assets/logo_AnDo_Ver_White.png" alt="CookedByAnDo" class="hud-logo">
    </div>
  </div>
</header>

<div class="page-header">
  <div class="page-header-inner">
    <a href="/" class="back-link">← Back to portfolio</a>
    <div class="page-header-bottom">
      <h1 class="page-title">All <em>films</em></h1>
      <div class="page-count" id="filmCount"></div>
    </div>
  </div>
</div>

<div class="work-section">
  <div class="work-section-inner">
    <div class="all-grid" id="allWorkGrid"></div>
  </div>
</div>

<footer>
  <div class="footer-inner">
    <div>© 2026 AnDo · All rights reserved</div>
    <div class="center">Made in Hà Nội</div>
    <div class="right"><a href="/">← Portfolio</a></div>
  </div>
</footer>

<script>
  (function(){
    const el = document.getElementById('tc');
    if(!el) return;
    function pad(n,l=2){ return String(n).padStart(l,'0'); }
    function tick(){ const d=new Date(); el.textContent=`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}:${pad(Math.floor(d.getMilliseconds()/40),2)}`; }
    setInterval(tick,40); tick();
  })();

  const io = new IntersectionObserver(entries=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  },{threshold:.1});

  fetch('/content/work.json').then(r=>r.json()).then(data=>{
    const items = data.items;
    document.getElementById('filmCount').textContent = `${items.length} films · 2023–2026`;
    document.getElementById('allWorkGrid').innerHTML = items.map((item,i)=>{
      const num = String(i+1).padStart(2,'0');
      const title = item.title2 ? `${item.title1}<br>${item.title2}` : item.title1;
      return `<article class="work-card reveal" data-video-id="${item.youtube_id}">
        <div class="work-thumb">
          <img src="https://i.ytimg.com/vi/${item.youtube_id}/maxresdefault.jpg" alt="${item.title1}" loading="lazy">
          <span class="work-thumb-num">PROJECT / ${num}</span>
          <div class="work-thumb-title"><h3>${title}</h3></div>
        </div>
        <div class="work-meta">
          <span>${item.role}</span>
          <a href="https://youtu.be/${item.youtube_id}" target="_blank" rel="noopener" class="arrow">→</a>
        </div>
      </article>`;
    }).join('');

    document.querySelectorAll('.work-card').forEach(card=>{
      io.observe(card);
      card.addEventListener('click', ()=>openVideo(card.dataset.videoId));
    });
  });

  const modal = document.getElementById('videoModal');
  const frame = document.getElementById('videoModalFrame');
  document.getElementById('videoModalClose').addEventListener('click', closeVideo);
  modal.addEventListener('click', e=>{ if(e.target===modal) closeVideo(); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeVideo(); });

  function openVideo(id){ frame.src=`https://www.youtube.com/embed/${id}?autoplay=1&rel=0`; modal.classList.add('open'); document.body.style.overflow='hidden'; }
  function closeVideo(){ modal.classList.remove('open'); frame.src=''; document.body.style.overflow=''; }
</script>
</body>
</html>
